[project]
name = "geolang-pipeline"
version = "0.1.0"
description = "Offline data pipeline for geolang: official languages, translations, romanization"
requires-python = ">=3.12"
dependencies = ["PyICU>=2.13", "fonttools[woff]>=4.50", "shapely==2.2.0"]  # exact: CI diffs the generated map

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["geolang"]

[tool.pytest.ini_options]
testpaths = ["tests"]
