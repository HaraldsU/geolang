name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.MD'
      - 'LICENSE*'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.MD'
      - 'LICENSE*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies (map topology builder)
        run: npm ci --ignore-scripts
        working-directory: web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ICU
        run: sudo apt-get update && sudo apt-get install -y libicu-dev pkg-config
      - name: Install pipeline
        run: pip install -e '.[dev]'
        working-directory: pipeline
      - uses: actions/cache@v4
        with:
          path: |
            pipeline/.cache/cldr
            pipeline/.cache/naturalearth
          key: sources-${{ hashFiles('pipeline/geolang/download.py', 'pipeline/geolang/borders.py') }}
      - name: Check committed country/language data is up to date
        working-directory: pipeline
        run: |
          python -m geolang languages
          git diff --exit-code -- ../web/static/data/countries.json ../web/static/data/languages.json ../web/static/world
      - name: pytest
        run: python -m pytest -q
        working-directory: pipeline

  web:
    name: Web (lint, types, unit tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

  e2e:
    # One job per browser/device so they run in parallel (~3 min instead of ~10).
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chrome, desktop-firefox, desktop-safari, pixel-7, iphone-14, ipad]
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright test --project=${{ matrix.project }}
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: web/test-results/
          retention-days: 7
