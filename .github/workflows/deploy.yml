name: Build data & deploy

# Deploys the static site to Cloudflare Pages on pushes to main (and on demand).
#
# The translation data (~370 MB, 5-15 min to build) is only rebuilt when it can have changed:
#   - monthly (schedule; kaikki.org refreshes its Wiktionary dumps),
#   - when the pipeline code/overrides or the map package change,
#   - or when requested via "Run workflow" with "Rebuild data" ticked.
# Otherwise the last built data is restored from the Actions cache and only the website is
# rebuilt, so a normal code push deploys in a few minutes.
#
# Requires repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID and the variables
# CLOUDFLARE_PROJECT (Pages project name) and PRODUCTION_URL (e.g. https://geolang.io).

on:
  schedule:
    - cron: '0 4 3 * *'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.MD'
      - 'LICENSE*'
  workflow_dispatch:
    inputs:
      rebuild_data:
        description: Rebuild the translation data even if a cached build exists
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web

      - name: Month key
        id: month
        run: echo "key=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      # Built data is keyed by month + everything that affects its content. Keys end in the run
      # id (cache entries are immutable); restore takes the newest build with a matching prefix.
      - name: Restore built data
        id: data
        uses: actions/cache/restore@v4
        with:
          path: |
            web/static/data
            web/static/world
          key: data-${{ steps.month.outputs.key }}-${{ hashFiles('pipeline/geolang/**', 'pipeline/overrides.json', 'pipeline/pyproject.toml', 'pipeline/wordlists/**', 'web/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            data-${{ steps.month.outputs.key }}-${{ hashFiles('pipeline/geolang/**', 'pipeline/overrides.json', 'pipeline/pyproject.toml', 'pipeline/wordlists/**', 'web/package-lock.json') }}-

      - name: Decide whether to rebuild data
        id: plan
        run: |
          if [ -z "${{ steps.data.outputs.cache-matched-key }}" ] \
             || [ "${{ github.event_name }}" = "schedule" ] \
             || [ "${{ inputs.rebuild_data }}" = "true" ] \
             || [ ! -f web/static/data/manifest.json ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "Rebuilding translation data"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "Reusing data from cache: ${{ steps.data.outputs.cache-matched-key }}"
          fi

      # ---- data build (only when needed) ---------------------------------------------------
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.rebuild == 'true'
        with:
          python-version: '3.12'
      - name: Install pipeline
        if: steps.plan.outputs.rebuild == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y libicu-dev pkg-config
          pip install -e 'pipeline[dev]'

      # Restore and save are separate steps so the downloads are cached even when a later step
      # (e.g. the Cloudflare upload) fails.
      - name: Restore source dumps & Wikidata labels
        if: steps.plan.outputs.rebuild == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            pipeline/.cache/kaikki
            pipeline/.cache/wikidata
            pipeline/.cache/cldr
            pipeline/.cache/fonts
            pipeline/.cache/naturalearth
          key: sources-${{ steps.month.outputs.key }}-${{ github.run_id }}
          restore-keys: |
            sources-${{ steps.month.outputs.key }}-
            sources-

      - name: Download Wiktionary dump (kaikki.org)
        if: steps.plan.outputs.rebuild == 'true'
        working-directory: pipeline
        run: |
          mkdir -p .cache/kaikki
          # re-download when the cached copy is from a previous month
          if [ ! -f .cache/kaikki/English.jsonl.gz ] || [ "$(date -r .cache/kaikki/English.jsonl.gz +%Y-%m)" != "$(date +%Y-%m)" ]; then
            # download to a temp name so a failed download never ends up in the cache
            curl -fL --retry 3 -A "geolang-pipeline/0.1" -o .cache/kaikki/English.jsonl.gz.part \
              https://kaikki.org/dictionary/English/kaikki.org-dictionary-English.jsonl.gz
            mv .cache/kaikki/English.jsonl.gz.part .cache/kaikki/English.jsonl.gz
          fi

      - name: Build data
        id: build
        if: steps.plan.outputs.rebuild == 'true'
        working-directory: pipeline
        env:
          GEOLANG_CONTACT: ${{ vars.GEOLANG_CONTACT }}
        run: |
          python -m geolang languages
          python -m geolang translations
          python -m geolang fonts
          python -m geolang coverage
          python -m pytest -q

      # Save even if the data build failed: the Wikidata label cache only ever contains
      # successful responses, so partial progress is still worth keeping.
      - name: Save source dumps & Wikidata labels
        if: always() && steps.plan.outputs.rebuild == 'true' && hashFiles('pipeline/.cache/kaikki/English.jsonl.gz') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            pipeline/.cache/kaikki
            pipeline/.cache/wikidata
            pipeline/.cache/cldr
            pipeline/.cache/fonts
            pipeline/.cache/naturalearth
          key: sources-${{ steps.month.outputs.key }}-${{ github.run_id }}

      - name: Save built data
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            web/static/data
            web/static/world
          key: ${{ steps.data.outputs.cache-primary-key }}

      # ---- site --------------------------------------------------------------------------
      - name: Build site
        working-directory: web
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/build --project-name=${{ vars.CLOUDFLARE_PROJECT }} --branch=main

  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Smoke tests against production
        run: npx playwright test --grep @prod --project=desktop-chrome --project=pixel-7
        env:
          HOME: /root
          BASE_URL: ${{ vars.PRODUCTION_URL }}
