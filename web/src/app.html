<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f4f1ea" />
		<script>
			// Before the first paint, so a remembered theme never flashes the other one.
			// Same logic and key as src/lib/theme.svelte.ts. It must stay above SvelteKit's head
			// placeholder: the CSP <meta> SvelteKit puts there (script-src 'self' + hashes of its own
			// scripts) only applies to what comes after it.
			(function () {
				var t = null;
				try {
					t = localStorage.getItem('geolang-theme');
				} catch (e) {}
				if (t !== 'light' && t !== 'dark') {
					t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.dataset.theme = t;
				if (t === 'dark') {
					document.querySelector('meta[name="theme-color"]').setAttribute('content', '#14171c');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
